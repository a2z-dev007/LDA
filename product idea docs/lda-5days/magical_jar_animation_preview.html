
<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #1a0a0f 0%, #2d1020 40%, #1a0a0f 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Georgia, serif; overflow: hidden; }

.scene { position: relative; width: 340px; height: 460px; display: flex; align-items: center; justify-content: center; }

/* JAR ASSEMBLY */
.jar-assembly { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 140px; height: 200px; }
.jar-glow-ring { position: absolute; top: 50%; left: 50%; width: 160px; height: 160px; transform: translate(-50%, -40%) scale(0); background: radial-gradient(ellipse, rgba(255,160,100,0.35) 0%, transparent 70%); border-radius: 50%; pointer-events: none; transition: opacity 0.3s; z-index: 0; }
.jar-body-wrap { position: absolute; width: 140px; top: 38px; left: 0; z-index: 2; transform-origin: center bottom; }
.jar-lid-wrap { position: absolute; width: 140px; top: 0; left: 0; z-index: 3; transform-origin: center bottom; }

/* FLYING PAPER */
.flying-paper { position: absolute; width: 72px; height: 58px; top: 0; left: 50%; transform: translateX(-50%); z-index: 20; pointer-events: none; opacity: 0; }

/* BURST PARTICLES */
.burst-container { position: absolute; bottom: 170px; left: 50%; transform: translateX(-50%); width: 0; height: 0; pointer-events: none; z-index: 25; }
.spark { position: absolute; width: 7px; height: 7px; border-radius: 50%; opacity: 0; pointer-events: none; }

/* FLOATING HEARTS */
.float-heart { position: absolute; font-size: 14px; opacity: 0; pointer-events: none; z-index: 15; }

/* TRAIL PARTICLES */
.trail-dot { position: absolute; width: 5px; height: 5px; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 18; }

/* COUNT BADGE */
.count-badge { position: absolute; bottom: 54px; right: 22px; background: linear-gradient(135deg, #ff6b9d, #ff4e8a); color: #fff; font-size: 13px; font-weight: 800; border-radius: 14px; min-width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; padding: 0 5px; font-family: system-ui; box-shadow: 0 2px 10px rgba(255,78,138,0.5); z-index: 30; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }

/* UI */
.ui { position: relative; z-index: 40; margin-top: 20px; display: flex; gap: 14px; align-items: center; }
.btn { background: linear-gradient(135deg, #ff6b9d, #e84c8a); color: #fff; border: none; border-radius: 24px; padding: 12px 28px; font-size: 14px; font-family: Georgia, serif; cursor: pointer; letter-spacing: 0.5px; box-shadow: 0 4px 20px rgba(232,76,138,0.45); transition: transform 0.15s, box-shadow 0.15s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(232,76,138,0.6); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.label { color: rgba(255,200,180,0.7); font-size: 13px; }

/* AMBIENT PARTICLES */
.ambient { position: absolute; border-radius: 50%; pointer-events: none; animation: floatUp linear infinite; opacity: 0; }
@keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 0; } 10% { opacity: 0.6; } 80% { opacity: 0.2; } 100% { transform: translateY(-200px) scale(0.3); opacity: 0; } }

/* SHIMMER ON JAR */
@keyframes jarShimmer { 0%,100%{opacity:0.4} 50%{opacity:0.7} }
</style>
</head>
<body>

<div class="scene" id="scene">
  <!-- Ambient floating particles -->
  <div class="scene" id="ambientLayer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:hidden;"></div>

  <!-- Burst container -->
  <div class="burst-container" id="burstContainer"></div>

  <!-- Jar assembly -->
  <div class="jar-assembly" id="jarAssembly">
    <div class="jar-glow-ring" id="glowRing"></div>

    <!-- Lid (SVG) -->
    <div class="jar-lid-wrap" id="jarLid">
      <svg width="140" height="38" viewBox="0 0 140 38">
        <defs>
          <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffd4e0"/>
            <stop offset="50%" stop-color="#ff9dbf"/>
            <stop offset="100%" stop-color="#e8739f"/>
          </linearGradient>
          <linearGradient id="lidGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffe8f0"/>
            <stop offset="100%" stop-color="#ffb8d0"/>
          </linearGradient>
          <radialGradient id="knobShine" cx="40%" cy="35%" r="55%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ffd0e8" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <!-- Lid body -->
        <rect x="12" y="14" width="116" height="22" rx="11" fill="url(#lidGrad)" stroke="#d4608a" stroke-width="1"/>
        <!-- Rim shadow -->
        <rect x="10" y="31" width="120" height="4" rx="2" fill="#c05070" opacity="0.3"/>
        <!-- Shine streak -->
        <rect x="20" y="16" width="32" height="8" rx="4" fill="#ffffff" opacity="0.45"/>
        <!-- Knob -->
        <ellipse cx="70" cy="10" rx="18" ry="9" fill="url(#lidGrad2)" stroke="#d4608a" stroke-width="0.8"/>
        <ellipse cx="70" cy="8" rx="12" ry="5.5" fill="url(#knobShine)"/>
        <!-- Knob highlight dot -->
        <ellipse cx="64" cy="7" rx="3.5" ry="2.5" fill="#fff" opacity="0.55"/>
        <!-- Gold rim line -->
        <rect x="12" y="24" width="116" height="2.5" rx="1" fill="#ffd4a0" opacity="0.45"/>
      </svg>
    </div>

    <!-- Jar body (SVG) -->
    <div class="jar-body-wrap" id="jarBodyWrap">
      <svg id="jarBodySvg" width="140" height="165" viewBox="0 0 140 165">
        <defs>
          <linearGradient id="glassV" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff5f8" stop-opacity="0.97"/>
            <stop offset="40%" stop-color="#ffe8ef" stop-opacity="0.92"/>
            <stop offset="100%" stop-color="#ffd5e5" stop-opacity="0.97"/>
          </linearGradient>
          <linearGradient id="glassH" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffeef4" stop-opacity="0.98"/>
            <stop offset="30%" stop-color="#fff5f8" stop-opacity="0.9"/>
            <stop offset="70%" stop-color="#ffeef4" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#ffe0ea" stop-opacity="0.98"/>
          </linearGradient>
          <radialGradient id="innerGlow" cx="35%" cy="25%" r="58%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#ffb8d0" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="paperSlipG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#fff0f5"/>
          </linearGradient>
          <clipPath id="bodyClip">
            <path d="M18 12 Q6 18 5 32 L3 140 Q2 160 14 162 L126 162 Q138 160 137 140 L135 32 Q134 18 122 12 Z"/>
          </clipPath>
        </defs>

        <!-- Neck collar -->
        <rect x="18" y="0" width="104" height="13" rx="6" fill="url(#glassH)" stroke="#e8a0b8" stroke-width="0.8"/>
        <rect x="16" y="10" width="108" height="5" rx="2" fill="#e090a8" opacity="0.25"/>

        <!-- Jar body shape -->
        <path d="M18 12 Q6 18 5 32 L3 140 Q2 160 14 162 L126 162 Q138 160 137 140 L135 32 Q134 18 122 12 Z"
          fill="url(#glassH)" stroke="#e8a0b8" stroke-width="1.8"/>
        <!-- Inner glow radial -->
        <path d="M18 12 Q6 18 5 32 L3 140 Q2 160 14 162 L126 162 Q138 160 137 140 L135 32 Q134 18 122 12 Z"
          fill="url(#innerGlow)"/>

        <!-- PAPER SLIPS (shown by count) -->
        <g id="paperSlips" clip-path="url(#bodyClip)"></g>

        <!-- Glass shine stripes -->
        <path d="M18 28 Q15 75 17 138" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.55" clip-path="url(#bodyClip)"/>
        <path d="M28 26 Q25 65 27 125" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.3" clip-path="url(#bodyClip)"/>
        <path d="M124 28 Q127 75 125 140" stroke="#d08090" stroke-width="6" stroke-linecap="round" opacity="0.22" clip-path="url(#bodyClip)"/>
        <!-- Bottom oval shadow -->
        <ellipse cx="70" cy="156" rx="40" ry="5" fill="#d08090" opacity="0.2" clip-path="url(#bodyClip)"/>

        <!-- Re-stroke edge (crisp outline) -->
        <path d="M18 12 Q6 18 5 32 L3 140 Q2 160 14 162 L126 162 Q138 160 137 140 L135 32 Q134 18 122 12 Z"
          fill="none" stroke="#e8a0b8" stroke-width="1.8"/>

        <!-- Shimmer highlight at top -->
        <path d="M30 18 Q70 14 110 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </svg>
    </div>

    <!-- Count badge -->
    <div class="count-badge" id="countBadge">0</div>
  </div>

  <!-- Flying paper slip -->
  <div class="flying-paper" id="flyingPaper">
    <svg width="72" height="58" viewBox="0 0 72 58">
      <defs>
        <linearGradient id="fpGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#fff0f5"/>
        </linearGradient>
      </defs>
      <rect x="3.5" y="3.5" width="65" height="51" rx="5" fill="#ffd5e5" opacity="0.5"/>
      <rect x="1.5" y="1.5" width="65" height="51" rx="5" fill="url(#fpGrad)" stroke="#ffb0cc" stroke-width="1.2"/>
      <!-- Ruled lines -->
      <line x1="9" y1="19" x2="59" y2="19" stroke="#ffccdd" stroke-width="1.3"/>
      <line x1="9" y1="30" x2="59" y2="30" stroke="#ffccdd" stroke-width="1.3"/>
      <line x1="9" y1="41" x2="59" y2="41" stroke="#ffccdd" stroke-width="1.3"/>
      <!-- Heart -->
      <g transform="translate(36, 16)">
        <path d="M0,-5 C-7,-12 -14,-5 -14,2 C-14,10 0,18 0,18 C0,18 14,10 14,2 C14,-5 7,-12 0,-5 Z" fill="#ff6b9d" opacity="0.9"/>
      </g>
      <!-- Dog-ear fold -->
      <path d="M56 1.5 L67 12.5 L56 12.5 Z" fill="#ffd5e5" opacity="0.7"/>
      <!-- Highlight corner -->
      <rect x="6" y="4" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.55"/>
    </svg>
  </div>

  <!-- Float hearts (created dynamically) -->
</div>

<!-- UI Controls -->
<div class="ui">
  <button class="btn" id="triggerBtn" onclick="triggerAnimation()">Add Memory ♥</button>
  <span class="label" id="statusLabel">tap to add</span>
</div>

<script>
// ── State ──
let count = 0;
let animating = false;

// ── Paper slips data ──
const SLIPS = [
  { x:20, y:48, w:42, h:30, rot:-18 },
  { x:74, y:44, w:38, h:28, rot:14 },
  { x:15, y:80, w:36, h:26, rot:-10 },
  { x:62, y:76, w:44, h:32, rot:20 },
  { x:38, y:62, w:42, h:30, rot:3 },
];

const HEART_D = (s) =>
  `M0,${-s*.15} C${-s*.5},${-s*.65} ${-s},${-s*.1} ${-s},${s*.3} C${-s},${s*.8} 0,${s*1.05} 0,${s*1.05} C0,${s*1.05} ${s},${s*.8} ${s},${s*.3} C${s},${-s*.1} ${s*.5},${-s*.65} 0,${-s*.15} Z`;

// ── Helpers ──
const lerp = (a, b, t) => a + (b-a)*t;
const easeOut = (t) => 1 - Math.pow(1-t, 3);
const easeIn  = (t) => Math.pow(t, 3);
const easeInOut = (t) => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const bounce = (t) => {
  const n1=7.5625, d1=2.75;
  if(t<1/d1) return n1*t*t;
  if(t<2/d1) return n1*(t-=1.5/d1)*t+0.75;
  if(t<2.5/d1) return n1*(t-=2.25/d1)*t+0.9375;
  return n1*(t-=2.625/d1)*t+0.984375;
};

function animate(duration, onTick, onDone) {
  const start = performance.now();
  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    onTick(t);
    if(t < 1) requestAnimationFrame(frame);
    else if(onDone) onDone();
  }
  requestAnimationFrame(frame);
}

// ── Render paper slips ──
function renderSlips(n) {
  const g = document.getElementById('paperSlips');
  const ns = 'http://www.w3.org/2000/svg';
  g.innerHTML = '';
  const visible = Math.min(n, SLIPS.length);
  for(let i=0; i<visible; i++) {
    const p = SLIPS[i];
    const cx = p.x + p.w/2, cy = p.y + p.h/2;
    const grp = document.createElementNS(ns, 'g');
    grp.setAttribute('transform', `rotate(${p.rot},${cx},${cy})`);
    // shadow
    const sh = document.createElementNS(ns, 'rect');
    sh.setAttribute('x', p.x+2); sh.setAttribute('y', p.y+2);
    sh.setAttribute('width', p.w); sh.setAttribute('height', p.h);
    sh.setAttribute('rx', '4'); sh.setAttribute('fill', '#ffd5e5');
    sh.setAttribute('opacity', '0.45'); grp.appendChild(sh);
    // body
    const r = document.createElementNS(ns, 'rect');
    r.setAttribute('x', p.x); r.setAttribute('y', p.y);
    r.setAttribute('width', p.w); r.setAttribute('height', p.h);
    r.setAttribute('rx', '4'); r.setAttribute('fill', 'url(#paperSlipG)');
    r.setAttribute('stroke', '#ffccdd'); r.setAttribute('stroke-width', '0.7');
    grp.appendChild(r);
    // lines
    for(const yf of [0.38, 0.62]) {
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', p.x+5); l.setAttribute('y1', p.y+p.h*yf);
      l.setAttribute('x2', p.x+p.w-5); l.setAttribute('y2', p.y+p.h*yf);
      l.setAttribute('stroke', '#ffccdd'); l.setAttribute('stroke-width', '0.8');
      grp.appendChild(l);
    }
    // mini heart
    const hg = document.createElementNS(ns, 'g');
    hg.setAttribute('transform', `translate(${cx},${cy-1})`);
    const hp = document.createElementNS(ns, 'path');
    const hs = (i===4) ? 5.5 : 3.8;
    hp.setAttribute('d', HEART_D(hs));
    hp.setAttribute('fill', (i===4) ? '#ff6b9d' : '#e8a0b8');
    hp.setAttribute('opacity', (i===4) ? '0.95' : '0.75');
    hg.appendChild(hp); grp.appendChild(hg);
    g.appendChild(grp);
  }
}

// ── Ambient particles ──
const AMBIENT_COLORS = ['#ff9dbf','#ffb8d4','#ffd5e5','#ff6b9d','#ffc8d8'];
function spawnAmbient() {
  const layer = document.getElementById('ambientLayer');
  const p = document.createElement('div');
  p.className = 'ambient';
  const sz = 3 + Math.random()*4;
  p.style.cssText = `width:${sz}px;height:${sz}px;background:${AMBIENT_COLORS[Math.floor(Math.random()*AMBIENT_COLORS.length)]};left:${10+Math.random()*80}%;bottom:${5+Math.random()*30}%;animation-duration:${3+Math.random()*4}s;animation-delay:${Math.random()*3}s;opacity:0;`;
  layer.appendChild(p);
  setTimeout(() => { if(p.parentNode) p.parentNode.removeChild(p); }, 7000);
}
setInterval(spawnAmbient, 600);

// ── Burst sparkles ──
const BURST_DEFS = [
  {dx:-36,dy:-28,color:'#ff6b9d',size:8},
  {dx: 36,dy:-30,color:'#ffd700',size:7},
  {dx:-42,dy: 8, color:'#fff',   size:6},
  {dx: 40,dy: 10,color:'#ffb8d4',size:8},
  {dx:-18,dy:-44,color:'#ff9dbf',size:6},
  {dx: 20,dy:-40,color:'#ffd700',size:7},
  {dx:  4,dy:-50,color:'#ff6b9d',size:6},
  {dx: 46,dy:-18,color:'#fff',   size:5},
  {dx:-46,dy:-15,color:'#ffa0c0',size:5},
  {dx:  0,dy:-56,color:'#ffd700',size:7},
];

function triggerBurst() {
  const container = document.getElementById('burstContainer');
  BURST_DEFS.forEach((b, i) => {
    const spark = document.createElement('div');
    spark.className = 'spark';
    spark.style.cssText = `background:${b.color};width:${b.size}px;height:${b.size}px;box-shadow:0 0 ${b.size*2}px ${b.color};left:0;top:0;`;
    container.appendChild(spark);
    const delay = i * 20;
    setTimeout(() => {
      spark.style.transition = 'none';
      spark.style.opacity = '1';
      spark.style.transform = 'translate(0,0) scale(1)';
      requestAnimationFrame(() => {
        spark.style.transition = `transform 0.55s cubic-bezier(0.2,1,0.3,1), opacity 0.55s ease-out`;
        spark.style.transform = `translate(${b.dx}px,${b.dy}px) scale(0.2)`;
        spark.style.opacity = '0';
      });
      setTimeout(() => { if(spark.parentNode) container.removeChild(spark); }, 700);
    }, delay);
  });
}

// ── Floating hearts ──
const FLOAT_DEFS = [
  {dx:-70,dy:-60,size:14,color:'#ff6b9d',delay:0},
  {dx: 72,dy:-80,size:12,color:'#ffd700',delay:80},
  {dx:-40,dy:-100,size:10,color:'#fff',  delay:150},
  {dx: 45,dy:-90, size:12,color:'#ff9dbf',delay:50},
  {dx: -5,dy:-115,size:10,color:'#ff6b9d',delay:120},
  {dx: 60,dy:-45, size:14,color:'#ffd4e8',delay:200},
];
function triggerFloatHearts() {
  const scene = document.getElementById('scene');
  const jarRect = document.getElementById('jarAssembly').getBoundingClientRect();
  const sceneRect = scene.getBoundingClientRect();
  const cx = (jarRect.left + jarRect.right)/2 - sceneRect.left;
  const cy = (jarRect.top  + jarRect.bottom)/2 - sceneRect.top - 40;

  FLOAT_DEFS.forEach(h => {
    const el = document.createElement('div');
    el.className = 'float-heart';
    el.innerHTML = '♥';
    el.style.cssText = `color:${h.color};font-size:${h.size}px;left:${cx}px;top:${cy}px;text-shadow:0 0 8px ${h.color};`;
    scene.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'none'; el.style.opacity = '1';
      el.style.transform = 'translate(0,0) scale(1)';
      requestAnimationFrame(() => {
        el.style.transition = `transform 1.1s cubic-bezier(0.2,0.8,0.4,1), opacity 1.1s ease-out`;
        el.style.transform = `translate(${h.dx}px,${h.dy-30}px) scale(0.3)`;
        el.style.opacity = '0';
      });
      setTimeout(() => { if(el.parentNode) scene.removeChild(el); }, 1300);
    }, h.delay);
  });
}

// ── Glow ring ──
function pulseGlow(on) {
  const g = document.getElementById('glowRing');
  if(on) {
    g.style.transition = 'transform 0.3s ease-out, opacity 0.3s';
    g.style.transform = 'translate(-50%,-40%) scale(1)';
    g.style.opacity = '1';
  } else {
    g.style.transition = 'transform 0.4s ease-in, opacity 0.4s';
    g.style.transform = 'translate(-50%,-40%) scale(0)';
    g.style.opacity = '0';
  }
}

// ── MAIN ANIMATION ──
function triggerAnimation() {
  if(animating) return;
  animating = true;
  const btn = document.getElementById('triggerBtn');
  const status = document.getElementById('statusLabel');
  btn.disabled = true;
  status.textContent = 'flying in...';

  const paper = document.getElementById('flyingPaper');
  const lid   = document.getElementById('jarLid');
  const body  = document.getElementById('jarBodyWrap');
  const badge = document.getElementById('countBadge');
  const scene = document.getElementById('scene');
  const sceneRect = scene.getBoundingClientRect();

  // Compute jar mouth target in scene coords
  const jarEl = document.getElementById('jarAssembly');
  const jarRect = jarEl.getBoundingClientRect();
  // Jar mouth is just below lid, center
  const mouthX = (jarRect.left + jarRect.right)/2 - sceneRect.left - 36; // center - half paper
  const mouthY = jarRect.top - sceneRect.top + 30; // top of body

  // Paper starts above center-top
  const startX = scene.offsetWidth/2 - 36;
  const startY = -80;

  // Paper arc control point (goes wide arc)
  const arc1X = startX - 90;
  const arc1Y = startY + 40;
  const arc2X = mouthX + 20;
  const arc2Y = mouthY - 50;

  // PHASE 1: Paper spawns and arcs toward jar (0–600ms)
  paper.style.opacity = '1';
  paper.style.left = startX + 'px';
  paper.style.top  = startY + 'px';
  paper.style.transform = 'rotate(-20deg) scale(1)';

  // ── 1. Paper arc flight ──
  animate(600, t => {
    const e = easeOut(t);
    // Cubic bezier path: start → arc1 → arc2 → mouth
    const t2 = t, t1 = 1-t;
    const x = t1*t1*t1*startX + 3*t1*t1*t*arc1X + 3*t1*t*t*arc2X + t*t*t*mouthX;
    const y = t1*t1*t1*startY + 3*t1*t1*t*arc1Y + 3*t1*t*t*arc2Y + t*t*t*mouthY;
    const rot = lerp(-20, 10, easeInOut(t));
    paper.style.left = x + 'px';
    paper.style.top  = y + 'px';
    paper.style.transform = `rotate(${rot}deg) scale(1)`;
    // Trail dots
    if(Math.random() < 0.35) spawnTrail(x+36, y+29, scene);
  }, () => {
    status.textContent = 'lid opening...';
    // ── 2. Lid lifts open (600–900ms) ──
    pulseGlow(true);
    animate(280, t => {
      const lift = easeOut(t) * -52;
      const rot  = easeOut(t) * -14;
      lid.style.transform = `translateY(${lift}px) rotate(${rot}deg)`;
    }, () => {
      status.textContent = 'dropping in...';
      // ── 3. Paper drops into jar mouth + scales down (900–1150ms) ──
      const fromX = mouthX, fromY = mouthY;
      const toX = mouthX + 14, toY = mouthY + 45;
      animate(280, t => {
        const e = easeIn(t);
        const x = lerp(fromX, toX, e);
        const y = lerp(fromY, toY, e);
        const sc = lerp(1, 0.25, e);
        const rot = lerp(10, 5, t);
        paper.style.left = x + 'px';
        paper.style.top  = y + 'px';
        paper.style.transform = `rotate(${rot}deg) scale(${sc})`;
        paper.style.opacity = String(1 - e * 0.7);
      }, () => {
        paper.style.opacity = '0';
        // Increment count
        count++;
        renderSlips(count);
        badge.textContent = count;
        badge.style.transform = 'scale(1.45)';
        setTimeout(() => { badge.style.transform = 'scale(1)'; }, 300);
        status.textContent = 'safe and sound!';

        // ── 4. Lid snaps closed with bounce (1150–1400ms) ──
        animate(300, t => {
          const e = bounce(t);
          lid.style.transform = `translateY(${-52 * (1 - e)}px) rotate(${-14 * (1-e)}deg)`;
        }, () => {
          lid.style.transform = 'translateY(0) rotate(0deg)';
          // ── 5. Jar body impact shake + glow burst ──
          triggerBurst();
          triggerFloatHearts();
          pulseGlow(false);
          animate(360, t => {
            const wave = Math.sin(t * Math.PI * 4) * (1-t);
            const sc   = 1 + Math.sin(t * Math.PI) * 0.06;
            body.style.transform = `rotate(${wave * 5}deg) scale(${sc})`;
          }, () => {
            body.style.transform = '';
            animating = false;
            btn.disabled = false;
            status.textContent = count === 1 ? 'first memory!' : `${count} memories`;
          });
        });
      });
    });
  });
}

function spawnTrail(x, y, scene) {
  const d = document.createElement('div');
  d.className = 'trail-dot';
  const colors = ['#ff9dbf','#ffd700','#ff6b9d'];
  d.style.cssText = `background:${colors[Math.floor(Math.random()*3)]};left:${x}px;top:${y}px;position:absolute;box-shadow:0 0 4px ${colors[0]};`;
  scene.appendChild(d);
  d.style.opacity = '0.8';
  animate(500, t => {
    d.style.opacity = String(0.8 * (1-t));
    d.style.transform = `scale(${1-t*0.5})`;
  }, () => { if(d.parentNode) scene.removeChild(d); });
}

// Init
renderSlips(0);
</script>
